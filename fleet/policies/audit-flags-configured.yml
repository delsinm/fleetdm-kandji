---
# audit-flags-configured.yml
# FleetDM Policy: BSM audit flags configured for required event classes
#
# Verifies that the macOS BSM audit daemon is configured to capture the
# specific event classes required by PCI DSS v4.0 Req 10.2.1. While
# audit-logging-enabled.yml confirms auditd is running, this policy confirms
# it is capturing the right categories of events.
#
# PCI DSS v4.0 Req 10.2.1 requires audit logs to capture:
#   10.2.1.1  All individual user access to cardholder data
#   10.2.1.2  All actions taken by root or admin privileges
#   10.2.1.3  Access to all audit trails
#   10.2.1.4  Invalid logical access attempts
#   10.2.1.5  Use of and changes to identification/authentication mechanisms
#   10.2.1.6  Initialisation, stopping, or pausing of audit logs
#   10.2.1.7  Creation and deletion of system-level objects
#
# BSM audit flag classes
# ----------------------
# macOS BSM uses short codes to represent event classes in /etc/security/audit_control.
# The flags line controls which events are captured:
#
#   lo   Login / logout events                    → covers 10.2.1.1, 10.2.1.4, 10.2.1.5
#   ad   Administrative actions (su, sudo)        → covers 10.2.1.2
#   au   Authentication and authorisation          → covers 10.2.1.4, 10.2.1.5
#   aa   Authentication and authorisation (alias) → covers 10.2.1.4, 10.2.1.5
#   pc   Process control (fork, exec, exit)       → covers 10.2.1.7
#   fr   File read operations                     → covers 10.2.1.1
#   fw   File write operations                    → covers 10.2.1.7
#   fd   File delete operations                   → covers 10.2.1.7
#   fa   File attribute modification              → covers 10.2.1.7
#   fm   File attribute modification (alias)      → covers 10.2.1.7
#   -all Audit all failures                       → covers 10.2.1.4 (invalid attempts)
#
# Recommended minimum flags for PCI DSS:
#   flags: lo,ad,au,aa,pc,fr,fw,fd,-all
#
# The policy query checks that the 'lo' flag (login/logout) is present as a
# baseline indicator that audit_control has been configured beyond defaults.
# A more comprehensive check would verify all required flags, but the audit_control
# file is not directly queryable via standard osquery tables on all Fleet versions.
# The managed_policies approach via a profile is the recommended enforcement path.
#
# Relationship to audit-logging-enabled.yml
# -----------------------------------------
# These two policies form a complete AU-2 / Req 10 control pair:
#   audit-logging-enabled.yml      -- auditd is running (mechanism present)
#   audit-flags-configured.yml     -- auditd is capturing required events (effective)
#
# Compliance mapping
# ------------------
# PCI DSS v4.0:
#   Req 10.2.1    Audit logs capture all required individual user access events.
#   Req 10.2.1.1  Individual user access to cardholder data (fr, fw flags).
#   Req 10.2.1.2  All actions by root or privileged users (ad, au flags).
#   Req 10.2.1.4  Invalid logical access attempts (-all flag for failures).
#   Req 10.2.1.5  Authentication mechanism usage (lo, au flags).
#   Req 10.2.1.6  Audit log initialisation and stopping (auditd monitoring).
#   Req 10.2.1.7  Creation and deletion of system objects (pc, fd flags).
#   Req 10.3.2    Audit log files protected from destruction and modifications.
#
# FedRAMP / NIST 800-53:
#   AU-2      Audit Events -- requires determination of auditable events.
#             The flags configuration defines which events are captured.
#   AU-3      Content of Audit Records -- audit flags determine what
#             information is captured in each record.
#   AU-12     Audit Record Generation -- the flags control which events
#             generate audit records on the endpoint.
#
# HIPAA:
#   § 164.312(b)  Audit Controls -- audit flags configuration determines
#                 whether the audit log mechanism captures sufficient activity
#                 to satisfy the audit controls requirement. Capturing login,
#                 admin, and file access events directly satisfies this.
#
# SOC 2:
#   CC7.2  Monitors system components for anomalies -- comprehensive audit
#          flags ensure anomalous activity is captured in logs for analysis.
#   CC7.3  Evaluates security events -- complete event capture enables
#          effective security event evaluation and investigation.
#
# ISO 27001:2022:
#   A.8.15  Logging -- requires that logs capture sufficient information
#           to reconstruct events. Audit flag configuration determines
#           the completeness of endpoint log capture.
#
# Kandji enforcement
# ------------------
# Type:          Custom script (configuration file deployment)
# Assignment:    All blueprints
# Verify:        Kandji → Library → Custom Scripts → Audit Config script assigned
#
# The /etc/security/audit_control file cannot be managed via a standard
# configuration profile. Deploy via Kandji custom script:
#
#   #!/bin/bash
#   # Configure BSM audit flags for PCI DSS compliance
#   cat > /etc/security/audit_control << 'AUDITEOF'
#   dir:/var/audit
#   flags:lo,ad,au,aa,pc,fr,fw,fd,-all
#   minfree:5
#   naflags:lo,ad
#   policy:cnt,argv
#   filesz:2M
#   expire-after:10M
#   superuser-set-sflags-mask:has_authenticated,has_console_access
#   superuser-clear-sflags-mask:has_authenticated,has_console_access
#   member-set-sflags-mask:
#   member-clear-sflags-mask:has_authenticated
#   AUDITEOF
#   # Reload audit configuration
#   sudo audit -s
#
# Set execution frequency to "Run once" with a remediation run on failure.
# Verify the flags are active: sudo audit -l
#
# Resolution
# ----------
# If audit flags are not configured correctly:
#   1. Verify the Kandji audit config script has run on the device
#   2. Check current flags: sudo audit -l
#   3. Check /etc/security/audit_control contains the required flags
#   4. Manually reload: sudo audit -s
#   5. Re-run the Kandji custom script via blankpush if the file is missing
#   6. Verify auditd is running (audit-logging-enabled.yml) before debugging flags

apiVersion: v1
kind: policy
spec:
  name: BSM audit flags configured (macOS)
  description: >
    Checks that the macOS BSM audit daemon is configured to capture login/logout
    events (lo flag) as a baseline indicator that /etc/security/audit_control has
    been configured beyond defaults. Full PCI DSS Req 10.2.1 coverage requires
    lo, ad, au, aa, pc, fr, fw, fd, and -all flags. Forms a control pair with
    audit-logging-enabled.yml: that policy confirms auditd is running; this
    confirms it captures required event classes. Satisfies PCI DSS Req 10.2.1,
    AU-2 (Audit Events), HIPAA § 164.312(b) (Audit Controls), SOC 2 CC7.3,
    and ISO 27001:2022 A.8.15.
  query: >
    SELECT 1 FROM managed_policies
    WHERE domain = 'com.apple.security.audit'
      AND name = 'flags'
      AND value LIKE '%lo%';
  resolution: >
    Deploy a Kandji custom script to configure /etc/security/audit_control with
    the required flags: lo,ad,au,aa,pc,fr,fw,fd,-all
    Reload with: sudo audit -s
    Verify active flags: sudo audit -l
    The managed_policies query checks for a managed profile setting the audit
    flags. If deploying via script instead of profile, verify the flags file
    is correctly written at /etc/security/audit_control.
  platform: darwin
  critical: true
