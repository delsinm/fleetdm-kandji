---
# backup-agent-running.yml
# FleetDM Policy: Endpoint backup solution running
#
# Verifies that at least one approved endpoint backup agent is active on the
# device. The policy passes if ANY of the supported backup solutions is
# running -- it does not require a specific product, making it portable
# across organisations using different backup tooling.
#
# Supported backup solutions (checked in order of FedRAMP preference):
#   Druva inSync          →  process: inSyncDeamon
#                            FedRAMP authorized -- preferred for regulated envs
#   Backblaze for Business →  process: bzfilelist
#                            Not FedRAMP authorized -- suitable for corp fleet
#   CrashPlan for Business →  process: CrashPlanService
#                            Not FedRAMP authorized -- suitable for corp fleet
#   Veeam Agent for Mac   →  process: VeeamAgent
#                            Not FedRAMP authorized -- suitable for corp fleet
#   Time Machine          →  launchd: com.apple.backupd
#                            Built-in macOS -- suitable for simple deployments
#                            Not recommended for distributed fleets at scale
#
# To add a backup solution: identify its macOS process name with
#   ps aux | grep <agent-name>
# and add a UNION branch to the query.
#
# To restrict to a specific solution: remove all UNION branches except the
# one for your approved solution, or create a dedicated policy file.
#
# Example -- Druva inSync only (recommended for FedRAMP High):
#
#   query: >
#     SELECT 1 FROM processes
#     WHERE name = 'inSyncDeamon';
#
# Example -- Backblaze only:
#
#   query: >
#     SELECT 1 FROM processes
#     WHERE name = 'bzfilelist';
#
# The UNION pattern is only needed when you want ANY of several solutions
# to satisfy the policy. A single-solution check is simpler and more
# explicit -- prefer it when your organisation has standardised on one tool.
#
# FedRAMP note
# ------------
# For FedRAMP High environments, only FedRAMP-authorized backup solutions
# satisfy CP-9. Currently only Druva inSync holds FedRAMP authorization
# among the options listed. If FedRAMP compliance is required, consider
# restricting this policy to the Druva inSync check only, or creating a
# separate fedramp-backup-agent-running.yml policy that checks exclusively
# for inSyncDeamon.
#
# Limitation
# ----------
# This policy verifies the backup agent process is running -- not that
# backups are completing successfully. A running agent can still fail
# silently if the backup destination is unreachable or storage is full.
# Verify backup completion status in your backup solution's management
# console separately. This policy satisfies the "mechanism is in place"
# dimension of CP-9 but not the "backups are verified" dimension (CP-9(1)).
#
# Compliance mapping
# ------------------
# FedRAMP / NIST 800-53:
#   CP-9      System Backup -- requires the organisation to conduct backups
#             of user-level information, system-level information, and system
#             documentation. A running backup agent is the primary technical
#             control satisfying this requirement at the endpoint level.
#   CP-9(1)   Testing for Reliability and Integrity -- requires testing of
#             backup information to verify media reliability and data integrity.
#             This policy does not satisfy CP-9(1) -- backup completion and
#             restore testing must be verified separately in the backup console.
#   CP-10     System Recovery and Reconstitution -- backup data is the
#             foundation of system recovery. A running backup agent ensures
#             recovery data is being collected continuously.
#   AU-9      Protection of Audit Information -- backup agents protect audit
#             logs from loss, supporting audit log retention requirements.
#
# HIPAA:
#   § 164.308(a)(7)(ii)(A)  Data Backup Plan -- requires creation and
#                           maintenance of retrievable exact copies of ePHI.
#                           A running backup agent is the technical mechanism
#                           satisfying this required implementation specification.
#   § 164.308(a)(7)(ii)(B)  Disaster Recovery Plan -- backup data is the
#                           foundation of disaster recovery for ePHI systems.
#   § 164.312(c)(1)         Integrity -- backup agents protect ePHI from loss
#                           due to hardware failure, ransomware, or accidental
#                           deletion, supporting data integrity requirements.
#
# SOC 2:
#   A1.2   Recovery Infrastructure -- requires the entity to authorise,
#          implement, and maintain recovery infrastructure. A running backup
#          agent is the endpoint component of the recovery infrastructure.
#   A1.3   Recovery Plan Testing -- similar to CP-9(1), this is not satisfied
#          by this policy alone. Backup restore tests must be conducted and
#          documented separately.
#   CC9.1  Risk of Business Disruption -- running backup agents directly
#          mitigate the risk of data loss as a business disruption event.
#
#
# PCI DSS v4.0:
#   Req 12.3.4  Hardware and software technologies reviewed at least once every
#               12 months — backup agent is a critical technology
#   Req 12.10.1 Incident response plan tested — backup agent is required for
#               recovery following a security incident
#
# ISO 27001:2022:
#   A.8.13  Information Backup -- requires backup copies of information,
#           software, and system images to be taken and tested regularly in
#           accordance with an agreed backup policy. A running backup agent
#           satisfies the technical implementation requirement.
#   A.5.29  Information Security During Disruption -- backup data is required
#           to maintain information security controls during disruption events.
#
# Kandji enforcement
# ------------------
# Type:          Custom App (varies by backup solution)
# Assignment:    All blueprints
#
# Deploy your chosen backup solution via Kandji Custom App or a native
# library item if available. Recommended approach per solution:
#
#   Druva inSync (FedRAMP preferred):
#     Kandji → Library → Custom Apps → upload Druva inSync pkg
#     Download installer from: admin.druva.com → Deploy → Endpoints
#
#   Backblaze for Business:
#     Kandji → Library → Custom Apps → upload Backblaze pkg
#     Download from: backblaze.com/business → Group Deployment
#
#   CrashPlan for Business:
#     Kandji → Library → Custom Apps → upload CrashPlan pkg
#     Download from: crashplan.com → Admin Console → Downloads
#
#   Time Machine (built-in, no pkg needed):
#     Kandji → Library → Custom Scripts → configure Time Machine destination
#     Script: sudo tmutil setdestination <destination-path>
#     Not recommended for distributed fleets -- requires network access to
#     a shared destination that may not be reachable for remote workers.
#
# If this policy fails repeatedly despite a blankpush:
#   1. Verify the backup agent pkg is assigned in the device's blueprint
#   2. Check the agent process manually: ps aux | grep <agent-name>
#   3. Check the backup management console for agent status on this device
#   4. Re-deploy the backup agent pkg via Kandji if installation failed
#
# Resolution
# ----------
# Verify which backup solution is approved for your environment, then
# confirm it is installed and running on the failing device:
#   Druva:      ps aux | grep inSyncDeamon
#   Backblaze:  ps aux | grep bzfilelist
#   CrashPlan:  ps aux | grep CrashPlanService
#   Veeam:      ps aux | grep VeeamAgent
#   Time Machine: sudo launchctl list | grep backupd
#
# Re-deploy the backup agent via Kandji if not installed. Check the backup
# management console for any licensing or connectivity issues preventing
# the agent from running after installation.

apiVersion: v1
kind: policy
spec:
  name: Endpoint backup agent running (macOS)
  description: >
    Checks that at least one approved endpoint backup agent is actively running.
    Passes if any of the following are found: Druva inSync (FedRAMP authorized),
    Backblaze for Business, CrashPlan for Business, Veeam Agent, or Time Machine.
    For FedRAMP High environments, restrict to Druva inSync only (see policy file
    comments). Satisfies CP-9 (System Backup), HIPAA § 164.308(a)(7)(ii)(A)
    (Data Backup Plan), SOC 2 A1.2 (Recovery Infrastructure), and ISO 27001:2022
    A.8.13 (Information Backup). Note: verifies agent is running, not that
    backups are completing -- verify backup success in the management console.
  query: >
    SELECT 1 WHERE EXISTS (
      SELECT 1 FROM processes WHERE name = 'inSyncDeamon'
      UNION
      SELECT 1 FROM processes WHERE name = 'bzfilelist'
      UNION
      SELECT 1 FROM processes WHERE name = 'CrashPlanService'
      UNION
      SELECT 1 FROM processes WHERE name = 'VeeamAgent'
      UNION
      SELECT 1 FROM launchd WHERE name = 'com.apple.backupd'
    );
  resolution: >
    Verify which backup solution is approved for your environment and confirm
    it is installed and running. Check: ps aux | grep <agent-name>
    Re-deploy the backup agent via the appropriate Kandji Custom App library
    item if not installed. For FedRAMP environments use Druva inSync (the only
    FedRAMP-authorized option in the supported list). Check the backup
    management console for licensing or connectivity issues if the agent
    installs but does not run.
  platform: darwin
  critical: true
