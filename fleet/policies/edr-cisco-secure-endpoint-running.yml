---
# cisco-secure-endpoint-running.yml
# FleetDM Policy: Cisco Secure Endpoint agent running
#
# Verifies that the Cisco Secure Endpoint agent (formerly AMP for Endpoints)
# is actively running on the endpoint. Cisco Secure Endpoint is Cisco's
# enterprise EDR/antivirus solution, an alternative to CrowdStrike Falcon
# for organisations in the Cisco security ecosystem.
#
# This policy is one of three equivalent EDR running policies. Use the one
# that matches your organisation's deployed EDR solution:
#   crowdstrike-running.yml             -- CrowdStrike Falcon
#   cisco-secure-endpoint-running.yml   -- Cisco Secure Endpoint
#   sentinelone-running.yml             -- SentinelOne
#
# Do not enable more than one EDR running policy simultaneously unless you
# are intentionally running a dual-EDR configuration, which is uncommon
# and may cause performance issues on endpoints.
#
# Agent process: ampdaemon (Cisco Secure Endpoint daemon)
# Install path:  /opt/cisco/amp/
# Console:       console.amp.cisco.com (commercial)
#                console.apjc.amp.cisco.com (APJC)
#                console.eu.amp.cisco.com (EU)
#
# Together with cisco-secure-endpoint-version.yml these two policies form
# a complete SI-3 control pair:
#   cisco-secure-endpoint-running.yml   -- agent is present and running
#   cisco-secure-endpoint-version.yml   -- agent is current and effective
#
# Compliance mapping
# ------------------
# FedRAMP / NIST 800-53:
#   SI-3      Malware Protection -- requires malware protection mechanisms
#             to be employed at workstations and entry/exit points. Cisco
#             Secure Endpoint is the primary endpoint malware protection
#             control for Cisco-based environments.
#   SI-3(1)   Central Management -- Cisco Secure Endpoint console provides
#             central management, policy enforcement, and visibility across
#             all enrolled endpoints.
#   SI-3(2)   Automatic Updates -- Cisco Secure Endpoint automatically
#             updates threat intelligence and detection signatures from
#             Cisco Talos, Cisco's threat intelligence organisation.
#   SI-4      Information System Monitoring -- Cisco Secure Endpoint's EDR
#             capability provides continuous behavioural monitoring of
#             endpoint activity.
#
# HIPAA:
#   § 164.308(a)(5)(ii)(B)  Protection from Malicious Software -- requires
#                           procedures for guarding against malicious software.
#                           Cisco Secure Endpoint provides real-time malware
#                           detection, prevention, and retrospective analysis.
#   § 164.306(a)(1)         Confidentiality, Integrity, Availability -- malware
#                           on an endpoint represents a direct risk to all three
#                           pillars of the Security Rule.
#   § 164.312(b)            Audit Controls -- Cisco Secure Endpoint's event
#                           telemetry contributes to audit trail requirements
#                           by recording process execution and file events.
#
# SOC 2:
#   CC6.8  Prevents or detects unauthorised software -- Cisco Secure Endpoint
#          is the primary control satisfying this criteria for endpoint
#          malware detection and prevention in Cisco environments.
#   CC7.2  Monitors system components for anomalies -- Cisco Secure Endpoint's
#          behavioural engine continuously monitors endpoint activity for
#          anomalous patterns indicative of compromise.
#   CC7.3  Evaluates security events -- Cisco Secure Endpoint events feed
#          into the security event evaluation and response process.
#
# ISO 27001:2022:
#   A.8.7   Protection Against Malware -- requires controls against malware
#           to be implemented. Cisco Secure Endpoint is the primary technical
#           control satisfying this requirement in Cisco environments.
#   A.8.16  Monitoring Activities -- Cisco Secure Endpoint provides continuous
#           endpoint behavioural monitoring required by this control.
#
# Kandji enforcement
# ------------------
# Type:          Custom package / library item
# Item:          Cisco Secure Endpoint installer pkg
# Assignment:    All blueprints
# Verify:        Kandji → Library → Custom Apps → Cisco Secure Endpoint assigned
#
# Cisco Secure Endpoint does not have a native Kandji library item.
# Deploy via Kandji Custom App using the installer package downloaded from
# your Cisco Secure Endpoint console:
#   console.amp.cisco.com → Download → Connector → macOS
#
# The installer package includes your organisation's group configuration
# and API credentials baked in. Upload to Kandji → Library → Custom Apps
# and assign to all blueprints.
#
# If this policy fails repeatedly despite blankpushes, verify:
#   1. The Cisco Secure Endpoint pkg is assigned in the device's blueprint
#   2. The device can reach Cisco cloud endpoints (api.amp.cisco.com)
#   3. No conflicting security software preventing agent installation
#   4. Check agent status: /opt/cisco/amp/bin/ampcli status
#
# Resolution
# ----------
# If Cisco Secure Endpoint is not running:
#   1. Check if installed: ls /opt/cisco/amp/
#   2. Check service status: sudo launchctl list | grep cisco
#   3. Attempt restart: sudo launchctl kickstart -k system/com.cisco.amp.daemon
#   4. If not installed, re-deploy via Kandji Custom App library item
#   5. If install fails, check network connectivity to Cisco cloud endpoints
#   6. Verify group policy in Cisco Secure Endpoint console allows the agent to run

apiVersion: v1
kind: policy
spec:
  name: Cisco Secure Endpoint running (macOS)
  description: >
    Checks that the Cisco Secure Endpoint agent (ampdaemon) is actively running.
    Primary endpoint malware protection and EDR control for Cisco environments.
    Use this policy instead of crowdstrike-running.yml for Cisco deployments.
    Satisfies SI-3 (Malware Protection), SI-3(1) (Central Management), HIPAA
    § 164.308(a)(5)(ii)(B) (Protection from Malicious Software), SOC 2 CC6.8,
    and ISO 27001:2022 A.8.7. Pair with cisco-secure-endpoint-version.yml for
    complete SI-3 coverage.
  query: >
    SELECT 1 FROM processes
    WHERE name = 'ampdaemon';
  resolution: >
    Verify Cisco Secure Endpoint is installed at /opt/cisco/amp/.
    Attempt to restart: sudo launchctl kickstart -k system/com.cisco.amp.daemon
    Check status: /opt/cisco/amp/bin/ampcli status
    If not installed, re-deploy via the Kandji Custom App library item.
    Verify network access to Cisco cloud endpoints if install fails.
  platform: darwin
  critical: true
