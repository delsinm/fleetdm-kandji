---
# cisco-secure-endpoint-version.yml
# FleetDM Policy: Cisco Secure Endpoint agent version current
#
# Verifies that the installed Cisco Secure Endpoint agent meets the minimum
# required version threshold. cisco-secure-endpoint-running.yml confirms the
# agent is running -- this policy confirms it is running a current, supported
# version with up-to-date detection capabilities.
#
# This policy is one of three equivalent EDR version policies. Use the one
# that matches your organisation's deployed EDR solution:
#   crowdstrike-version.yml             -- CrowdStrike Falcon
#   cisco-secure-endpoint-version.yml   -- Cisco Secure Endpoint
#   sentinelone-version.yml             -- SentinelOne
#
# Together with cisco-secure-endpoint-running.yml these two policies form
# a complete SI-3 control pair:
#   cisco-secure-endpoint-running.yml   -- agent is present and running
#   cisco-secure-endpoint-version.yml   -- agent is current and effective
#
# Version threshold
# -----------------
# Update the version in the query below when Cisco releases a new required
# minimum. Check your Cisco Secure Endpoint console under:
#   Management → Updates → Connector Updates
# for the current recommended minimum connector version.
#
# Cisco Secure Endpoint connector versions follow a MAJOR.MINOR.BUILD format.
# The query compares bundle_short_version which reflects the connector version.
#
# Current minimum: 1.22 (update as needed -- review quarterly)
#
# Compliance mapping
# ------------------
# FedRAMP / NIST 800-53:
#   SI-3      Malware Protection -- malware protection mechanisms must be
#             updated when new releases are available. An outdated Cisco
#             Secure Endpoint agent may lack detection capability for
#             recent threats identified by Cisco Talos.
#   SI-3(1)   Central Management -- the Cisco Secure Endpoint console
#             manages connector versions centrally. This policy verifies
#             the agent version aligns with the centrally managed update policy.
#   SI-2      Flaw Remediation -- outdated connector versions may contain
#             known vulnerabilities in the agent software itself.
#   SI-3(2)   Automatic Updates -- Cisco Secure Endpoint supports automatic
#             connector updates via the console. Verify auto-update is
#             enabled in your connector update policy.
#
# HIPAA:
#   § 164.308(a)(5)(ii)(B)  Protection from Malicious Software -- requires
#                           keeping protection software current. An outdated
#                           Cisco Secure Endpoint connector may miss recent
#                           malware variants from Cisco Talos threat intel.
#   § 164.306(a)(1)         Risk Analysis -- running an outdated EDR connector
#                           is a known, preventable risk that must be addressed.
#
# SOC 2:
#   CC6.8  Prevents or detects unauthorised software -- an outdated connector
#          may miss recent malware variants, weakening this control.
#   CC7.2  Monitors system components for anomalies -- connector effectiveness
#          depends on running a current, supported version with current
#          threat intelligence from Cisco Talos.
#
#
# PCI DSS v4.0:
#   Req 5.3.1   Anti-malware mechanisms kept current — version check verifies
#               agent is on a supported, current release
#   Req 6.3.3   All components protected from known vulnerabilities — outdated
#               EDR may contain known agent vulnerabilities
#
# ISO 27001:2022:
#   A.8.7   Protection Against Malware -- malware protection mechanisms must
#           be current. An outdated Cisco Secure Endpoint connector weakens
#           this control.
#   A.8.8   Management of Technical Vulnerabilities -- outdated connector
#           software may itself contain known vulnerabilities that must
#           be remediated.
#
# Kandji enforcement
# ------------------
# Type:          Custom package / library item (same as cisco-secure-endpoint-running.yml)
# Item:          Cisco Secure Endpoint installer pkg
# Assignment:    All blueprints
# Verify:        Cisco Secure Endpoint console → Management → Updates →
#                Connector Updates → auto-update policy enabled
#
# Cisco Secure Endpoint connector updates are managed via the Cisco Secure
# Endpoint console, not Kandji. In the console under Management → Updates:
#   1. Enable automatic connector updates
#   2. Set the update policy to apply to all device groups
#   3. Configure a maintenance window if needed for controlled rollout
#
# If a device is persistently on an old version:
#   1. Verify the device is online and can reach Cisco cloud endpoints
#   2. Check the update policy assignment in the Cisco console
#   3. Force an update check: /opt/cisco/amp/bin/ampcli update
#   4. For persistent failures, redeploy the updated pkg via Kandji Custom App
#
# Resolution
# ----------
# Cisco Secure Endpoint auto-updates in most configurations. If a device is
# on an outdated version:
#   1. Verify the device can reach Cisco cloud (api.amp.cisco.com)
#   2. Check the connector update policy in the Cisco Secure Endpoint console
#   3. Force an update: /opt/cisco/amp/bin/ampcli update
#   4. If auto-update is failing, redeploy the latest pkg via Kandji Custom App
#   5. Update the version threshold in this file after verifying the new
#      minimum in the Cisco Secure Endpoint console

apiVersion: v1
kind: policy
spec:
  name: Cisco Secure Endpoint version current (macOS)
  description: >
    Checks that the installed Cisco Secure Endpoint connector meets the minimum
    required version (1.22). Complements the Cisco Secure Endpoint running policy
    by verifying agent effectiveness, not just presence. Use this policy instead
    of crowdstrike-version.yml for Cisco deployments. Satisfies SI-3 (Malware
    Protection), SI-3(1) (Central Management), HIPAA § 164.308(a)(5)(ii)(B)
    (Protection from Malicious Software), SOC 2 CC6.8, and ISO 27001:2022 A.8.7.
    Update the version threshold quarterly or after major Cisco connector releases.
  query: >
    SELECT 1 FROM apps
    WHERE name = 'Cisco Secure Endpoint.app'
      AND bundle_short_version >= '1.22';
  resolution: >
    Cisco Secure Endpoint auto-updates in most configurations. Check the Cisco
    Secure Endpoint console to verify the device is assigned to an update policy
    that permits auto-update. Force an update check with:
    /opt/cisco/amp/bin/ampcli update
    For persistent failures, redeploy the latest connector pkg via Kandji Custom
    App. Update the version threshold in this file after verifying the new
    minimum connector version in the Cisco Secure Endpoint console.
  platform: darwin
  critical: true
