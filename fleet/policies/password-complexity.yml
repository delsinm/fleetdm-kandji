---
# password-complexity.yml
# FleetDM Policy: Password complexity enforced via managed policy
#
# Verifies that a password complexity policy is deployed via a managed
# preference profile. This checks that the organisation has pushed a
# password policy (minimum length, complexity requirements) via MDM --
# it does not verify individual password strength, which is not inspectable
# by osquery without elevated access.
#
# The query checks for the presence of a Kandji-deployed password policy
# profile via com.apple.mobiledevice.passwordpolicy. If no managed password
# policy is present, users can set trivially weak passwords.
#
# Recommended minimum password policy for compliance:
#   Minimum length:        12 characters
#   Require alphanumeric:  true
#   Minimum complex chars: 1 (symbol or number)
#   Maximum failed attempts before lockout: 10
#   Password history:      5 (prevent reuse)
#
# Compliance mapping
# ------------------
# FedRAMP / NIST 800-53:
#   IA-5      Authenticator Management -- requires the organisation to manage
#             authenticators (passwords) including enforcing minimum complexity
#             and length requirements.
#   IA-5(1)   Password-Based Authentication -- explicitly requires minimum
#             password length, complexity, and change requirements. This is
#             a High baseline required control.
#   AC-2      Account Management -- password policy is part of the account
#             management framework governing how credentials are provisioned
#             and maintained.
#
# HIPAA:
#   § 164.312(c)(2)  Mechanism to Authenticate ePHI -- password complexity
#                   requirements strengthen the authentication mechanism
#                   protecting access to systems containing ePHI.
#   § 164.312(d)    Person or Entity Authentication -- requires procedures to
#                   verify identity. Weak passwords undermine authentication
#                   effectiveness. Complexity requirements are a baseline control.
#   § 164.308(a)(5)(ii)(D) Password Management -- requires procedures for
#                   creating, changing, and safeguarding passwords. A managed
#                   complexity policy directly satisfies this specification.
#
# SOC 2:
#   CC6.1  Logical access controls -- password complexity is a foundational
#          logical access control. Managed enforcement ensures users cannot
#          circumvent organisational password requirements.
#   CC6.7  Restricts transmission of confidential information -- strong
#          passwords protect credentials from brute force, reducing risk
#          of credential-based attacks on systems holding confidential data.
#
#
# ISO 27001:2022:
#   A.8.5   Secure Authentication -- requires that authentication systems
#           follow best practices for managing passwords, including
#           minimum length and complexity requirements.
#   A.5.17  Authentication Information -- requires that password management
#           systems enforce adequate password quality including minimum
#           length and complexity. This maps to the organisational controls
#           theme but is implemented technically via this policy.
# Resolution
# ----------
# Deploy a Kandji configuration profile with a password policy payload
# (com.apple.mobiledevice.passwordpolicy) specifying:
#   minLength: 12
#   requireAlphanumeric: true
#   minComplexChars: 1
#   maxFailedAttempts: 10
#   pinHistory: 5
# Assign to all applicable blueprints. Users will be prompted to update
# their password on next login if it does not meet the new requirements.

# Kandji enforcement
# ------------------
# Type:          Configuration profile
# Profile:       Password Policy (Kandji → Library → Password Policy)
#                or Custom profile with com.apple.mobiledevice.passwordpolicy
# Assignment:    All blueprints
# Verify:        Kandji → Library → Password Policy → settings match policy requirements
#
# Recommended minimum settings to match this policy's compliance requirements:
#   Minimum passcode length:      12
#   Require alphanumeric value:   true
#   Minimum complex characters:   1
#   Maximum failed attempts:      10
#   Passcode history:             5
#
# Users will be prompted to update non-compliant passwords at next login.
# Kandji has a native Password Policy library item that simplifies this.
apiVersion: v1
kind: policy
spec:
  name: Password complexity enforced (macOS)
  description: >
    Checks that a password complexity policy is deployed via a Kandji managed
    profile (com.apple.mobiledevice.passwordpolicy). Ensures minimum length
    and complexity requirements are enforced organisationally, not left to
    user discretion. Satisfies IA-5(1) (Password-Based Authentication), HIPAA
    § 164.308(a)(5)(ii)(D) (Password Management), and SOC 2 CC6.1.
  query: >
    SELECT 1 FROM managed_policies
    WHERE domain = 'com.apple.mobiledevice.passwordpolicy'
      AND name = 'minLength'
      AND CAST(value AS INTEGER) >= 12;
  resolution: >
    Deploy a Kandji password policy configuration profile with minLength >= 12,
    requireAlphanumeric = true, minComplexChars >= 1, maxFailedAttempts <= 10,
    and pinHistory >= 5. Users will be prompted to update non-compliant passwords
    at next login. Verify profile assignment in Kandji blueprints.
  platform: darwin
  critical: true
