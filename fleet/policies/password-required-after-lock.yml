---
# password-required-after-lock.yml
# FleetDM Policy: Password required after sleep or screensaver
#
# Verifies that macOS is configured to require a password immediately (or within
# a short grace period) after the screensaver activates or the display sleeps.
# Without this, a screen lock policy is ineffective -- the device locks visually
# but remains accessible without credentials.
#
# This policy works in conjunction with screen-lock.yml:
#   screen-lock.yml                  -- screensaver activates after ≤5 minutes
#   password-required-after-lock.yml -- password required when screensaver ends
#
# Compliance mapping
# ------------------
# FedRAMP / NIST 800-53:
#   AC-11     Session Lock -- requires the system to initiate a session lock
#             after a period of inactivity and retain the lock until the user
#             re-authenticates. Password requirement is the re-authentication.
#   AC-11(1)  Pattern-Hiding Displays -- the screensaver must conceal
#             information AND require authentication to resume.
#   IA-11     Re-Authentication -- requires re-authentication when defined
#             circumstances occur, including session inactivity timeout.
#
# HIPAA:
#   § 164.312(c)(2)  Mechanism to Authenticate ePHI -- requires a corroborating
#                   mechanism to verify ePHI has not been altered or destroyed.
#                   Password re-authentication after lock supports this.
#   § 164.312(d)    Person or Entity Authentication -- requires procedures to
#                   verify that a person seeking access is the one claimed.
#                   Password requirement after lock enforces this at resumption.
#   § 164.312(a)(2)(iii) Automatic Logoff -- screen lock with password
#                   requirement is the primary macOS mechanism satisfying this.
#
# SOC 2:
#   CC6.1  Logical and physical access controls -- password requirement after
#          lock ensures physical access to an unattended device does not result
#          in unauthorised logical access.
#   CC6.8  Prevents unauthorised access -- without a password requirement,
#          a screen lock provides no meaningful access control.
#
#
# ISO 27001:2022:
#   A.8.5   Secure Authentication -- password requirement after lock
#           ensures that session resumption requires re-authentication,
#           a core secure authentication requirement.
#   A.8.1   User Endpoint Devices -- password enforcement after lock
#           is an explicit component of the endpoint device clear screen
#           and session management requirements.
# Resolution
# ----------
# Deploy a Kandji configuration profile setting askForPassword to true and
# askForPasswordDelay to 0 (immediate) under com.apple.screensaver.
# Verify with:
#   sudo defaults read /Library/Preferences/com.apple.screensaver askForPassword
# Expected output: 1

# Kandji enforcement
# ------------------
# Type:          Configuration profile
# Profile:       Custom profile — deploy com.apple.screensaver payload
# Assignment:    All blueprints
# Verify:        Kandji → Library → Custom Profiles → Screensaver profile assigned
#
# Add to the same com.apple.screensaver profile used for screen-lock.yml:
#   askForPassword:       true  (require password when screensaver ends)
#   askForPasswordDelay:  0     (immediate — no grace period)
#
# These two settings together satisfy both screen-lock.yml and this policy.
# A single profile covers both controls — no need for a separate profile.
apiVersion: v1
kind: policy
spec:
  name: Password required after lock (macOS)
  description: >
    Checks that macOS requires a password immediately after the screensaver
    activates or display sleeps. Works in conjunction with the screen lock
    policy -- without this, screen lock provides no access control. Satisfies
    AC-11 (Session Lock), IA-11 (Re-Authentication), HIPAA § 164.312(d)
    (Authentication), and SOC 2 CC6.1.
  query: >
    SELECT 1 FROM managed_policies
    WHERE domain = 'com.apple.screensaver'
      AND name = 'askForPassword'
      AND value = '1';
  resolution: >
    Deploy a Kandji configuration profile setting com.apple.screensaver
    askForPassword to true and askForPasswordDelay to 0. Verify with:
    sudo defaults read /Library/Preferences/com.apple.screensaver askForPassword
    Expected output: 1. Trigger a blankpush if the profile is not applying.
  platform: darwin
  critical: true
