      #     curl --fail-with-body -s \
      #       -H "Authorization: Splunk $SPLUNK_HEC_TOKEN" \
      #       -H "Content-Type: application/json" \
      #       "$SPLUNK_HEC_URL" \
      #       --data-binary "$BATCH"

      # -----------------------------------------------------------------------
      # Option B: Datadog Log Intake API
      #
      # Secrets required:
      #   DATADOG_API_KEY   Datadog API key (Organization Settings → API Keys)
      #
      # Ships logs to the Datadog US1 intake endpoint. If your Datadog org is
      # on a different site, update the URL:
      #   US1:    https://http-intake.logs.datadoghq.com/api/v2/logs
      #   US3:    https://http-intake.logs.us3.datadoghq.com/api/v2/logs
