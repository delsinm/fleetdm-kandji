# .github/workflows/drift-check.yml
#
# Scheduled compliance drift check.
#
# Runs drift_check.py on a regular schedule, polling FleetDM for any devices
# currently failing watched policies and issuing Kandji blankpushes to
# remediate them. Posts a summary to Slack if any drift is found.
#
# Schedule: hourly, 24/7 — continuous monitoring, no time restriction.
# Continuous monitoring satisfies CA-7 (FedRAMP), CC7.2 (SOC 2), and
# equivalent requirements across HIPAA and ISO 27001. Clean runs produce
# no Slack message so off-hours execution has no operational impact.
#
# Log shipping (SIEM)
# -------------------
# The drift check emits structured JSON to JSON_LOG_FILE, which is uploaded
# to your SIEM at the end of every run. Enable the shipping step for your
# SIEM by uncommenting the relevant block and adding the required secret.
#
# Supported SIEMs:
#   Splunk HEC        →  add secret: SPLUNK_HEC_TOKEN, SPLUNK_HEC_URL
#   Datadog           →  add secret: DATADOG_API_KEY
#   Elastic           →  add secret: ELASTIC_API_KEY, ELASTIC_ENDPOINT
#   Google SecOps     →  add secret: GOOGLE_SECOPS_API_KEY, GOOGLE_SECOPS_CUSTOMER_ID
#   Sumo Logic        →  add secret: SUMO_HTTP_SOURCE_URL
#   AWS CloudWatch    →  add secret: AWS_ROLE_ARN (OIDC, no long-lived credentials)
#
# Retention and protection
# ------------------------
# JSON logs are written to a temp file during the run and uploaded to your
# SIEM immediately after. The SIEM becomes the system of record for audit
# evidence -- logs are retained and protected per your SIEM's configuration,
# independent of GitHub Actions' 90-day run log retention limit.
# This satisfies AU-9 (log protection) and AU-11 (log retention) for FedRAMP.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   FLEET_URL          Base URL of your Fleet server
#   FLEET_API_TOKEN    Fleet API bearer token
#   SLACK_BOT_TOKEN    Slack bot token (xoxb-)
#   SLACK_CHANNEL_ID   Channel ID for your configured Slack channel
#   KANDJI_API_TOKEN   Kandji API bearer token
#   KANDJI_SUBDOMAIN   Kandji subdomain (e.g. "acme" for acme.api.kandji.io)
#
# To trigger manually: Actions → Fleet Drift Check → Run workflow

name: Fleet Drift Check

on:
  schedule:
    - cron: '0 * * * *'    # hourly, 24/7 — continuous monitoring, no time restriction
  workflow_dispatch:               # allow manual trigger from GitHub UI

jobs:
  drift-check:
    name: Run compliance drift check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Get the current year and week number to use as a cache key component.
      # This forces the cache to bust every Monday regardless of repo activity,
      # ensuring requests and pyyaml are updated at least once a week.
      - name: Get current week
        id: date
        run: echo "week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      # Cache the pip download directory so dependencies don't need to be
      # re-downloaded on every run. Cache busts weekly to pick up latest
      # patch releases without pinning to specific versions.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: drift-check-${{ runner.os }}-${{ steps.date.outputs.week }}

      - name: Install dependencies
        run: pip install -r remediation/requirements.txt

      - name: Run drift check
        env:
          FLEET_URL:        ${{ secrets.FLEET_URL }}
          FLEET_API_TOKEN:  ${{ secrets.FLEET_API_TOKEN }}
          SLACK_BOT_TOKEN:  ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          KANDJI_API_TOKEN: ${{ secrets.KANDJI_API_TOKEN }}
          KANDJI_SUBDOMAIN: ${{ secrets.KANDJI_SUBDOMAIN }}
          JSON_LOG_FILE:    /tmp/drift_check.jsonl
        run: python remediation/drift_check.py

      # -----------------------------------------------------------------------
      # SIEM log shipping — uncomment ONE of the blocks below.
      #
      # All blocks use `if: always()` so logs are shipped even when the drift
      # check exits with code 1 (e.g. API timeout, unhandled exception).
      # Partial logs from a failed run are still useful audit evidence.
      #
      # Each block ships /tmp/drift_check.jsonl — the structured JSON output
      # from the drift check. Each line is a self-contained JSON event record.
