      #       --data-binary "$PAYLOAD"

      # -----------------------------------------------------------------------
      # Option C: Elastic (Elasticsearch Bulk API)
      #
      # Secrets required:
      #   ELASTIC_ENDPOINT  Full Elasticsearch endpoint, e.g.:
      #                     https://my-cluster.es.us-east-1.aws.elastic-cloud.com
      #   ELASTIC_API_KEY   Base64-encoded API key (Kibana → Stack Management →
      #                     API Keys → Create API key)
      #
      # Ships logs using the Bulk API to the fleet-drift-check-YYYY.MM.DD index.
      # Daily indices make retention management straightforward -- configure an
      # ILM policy in Kibana to roll over and delete after your required period.
