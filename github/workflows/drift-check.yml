      #
      # The script wraps each JSON line in a Splunk event envelope and ships
      # them in a single batch POST. Splunk HEC accepts up to 1MB per request --
      # at ~500 bytes per event this handles ~2000 events per run comfortably.
      #
      # Splunk index and sourcetype are set via the HEC token configuration in
      # Splunk. Recommended: index=security, sourcetype=fleet_drift_check
