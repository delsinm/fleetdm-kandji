      # -----------------------------------------------------------------------
      # Option E: Sumo Logic (HTTP Source)
      #
      # Secrets required:
      #   SUMO_HTTP_SOURCE_URL  HTTP Source URL generated when you create an
      #                         HTTP Source in Sumo Logic:
      #                         Manage Data → Collection → Add Source →
      #                         HTTP Logs & Metrics → copy the generated URL
      #
      # Sumo Logic's HTTP Source is the simplest ingest API of any SIEM here --
      # JSON Lines can be POSTed directly with no wrapping or transformation.
      # Each line is ingested as a separate log message automatically.
      #
      # The X-Sumo-Category header sets the Source Category, which is used for
      # partitioning and searching in Sumo Logic. Recommended value:
      #   fleet/drift-check
      #
      # Sumo Logic retains logs per your account's retention settings. Configure
      # a Data Tier and retention period in Sumo Logic to meet AU-11 / PCI Req
      # 10.5 requirements (FedRAMP High: 3 years, PCI: 12 months minimum).
